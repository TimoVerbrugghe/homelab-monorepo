---
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  # The agent DaemonSet mounts the host's /var/log via hostPath to tail
  # Traefik's (and other pods') logs directly, which requires the privileged
  # Pod Security Standard (hostPath volumes are forbidden under baseline/restricted).
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
