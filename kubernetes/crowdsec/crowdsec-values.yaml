# yaml-language-server: $schema=https://raw.githubusercontent.com/crowdsecurity/helm-charts/main/charts/crowdsec/values.schema.json
#
# Values for the official `crowdsecurity/crowdsec` Helm chart, deploying the
# CrowdSec Security Engine (agent) as a DaemonSet reading Traefik's pod logs,
# plus the Local API (LAPI) that stores/serves ban decisions to the Traefik
# CrowdSec bouncer plugin (see kubernetes/traefik/traefik-values.yaml and
# kubernetes/traefik/middlewares/crowdsec-bouncer.yaml).

# Talos/containerd cluster: each line in /var/log/containers/*.log is wrapped
# in the containerd CRI log format (timestamp + stream + tags prefixing the
# actual log line), not the raw docker JSON log driver format. This setting
# only tells crowdsec how to unwrap that CRI framing; it is unrelated to (and
# does not change) the JSON *content* of Traefik's access log lines once
# unwrapped -- see the `acquisition` block below, which parses that JSON.
container_runtime: containerd

lapi:
  # No public exposure: only the in-cluster bouncer plugin needs to reach the
  # LAPI, via the ClusterIP `crowdsec-service` Service (default service type).
  ingress:
    enabled: false

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
    # readOnlyRootFilesystem/runAsNonRoot are left at the image defaults (root,
    # writable root filesystem): the crowdsec binary writes its SQLite
    # database, hub state and generated LAPI credentials under /etc/crowdsec
    # and /var/lib/crowdsec/data at runtime and the upstream image does not
    # ship a non-root user.

  podLabels:
    app.kubernetes.io/name: crowdsec-lapi
    app.kubernetes.io/instance: crowdsec-lapi

  # No dynamic StorageClass is provisioned for this workload; both volumes
  # default to `enabled: true` upstream, so they must be explicitly disabled
  # here. This also means the SQLite decisions database (all currently active
  # bans) is lost on every pod restart, not just registered bouncer/machine
  # credentials. The credential loss is a non-issue for both the Traefik
  # bouncer and the agent: see `env` below, which re-registers each of them
  # with a fixed identity on every startup. The decision loss just means
  # active bans are re-derived from live log traffic rather than persisted;
  # there is no user-facing action needed.
  persistentVolume:
    data:
      enabled: false
    config:
      enabled: false

  # crowdsecurity/crowdsec's entrypoint (docker-start-custom.sh) scans for
  # BOUNCER_KEY_<name> env vars on every container start and idempotently
  # runs `cscli bouncers add <name> -k <key>` for each one (skipping it if a
  # bouncer with that name is already registered). Pointing this at the same
  # crowdsec-bouncer-secrets Secret the Traefik plugin reads means the
  # traefik_bouncer registration always uses the same pre-shared key, so it
  # survives LAPI pod restarts/recreation without persistent storage and
  # without ever needing to re-run `cscli bouncers add` or update the Traefik
  # secret. The bouncer name may only contain [A-Za-z0-9_]: the entrypoint
  # discovers these via `compgen -A variable`, which does not expose
  # hyphenated env var names as shell variables.
  # crowdsecurity/crowdsec's entrypoint also reads AGENT_USERNAME/AGENT_PASSWORD (if
  # both are set) and unconditionally runs
  # `cscli machines add "$AGENT_USERNAME" --password "$AGENT_PASSWORD" --force` on
  # every start -- the same idempotent, no-persistence-needed pattern as the
  # BOUNCER_KEY_* mechanism above, but for the agent DaemonSet's machine credentials
  # (see agent.env below). Without this, a fresh LAPI pod has no record of the
  # agent's previously auto-generated machine identity and every acquisition/push
  # from the agent fails with "machine <id> not found" until the agent pod is also
  # restarted and re-registers itself -- which still works today because the agent
  # DaemonSet regenerates local_api_credentials.yaml on its own restart, but ties an
  # LAPI-only restart to needing a matching agent restart. Fixing both sides removes
  # that coupling entirely.
  env:
    - name: BOUNCER_KEY_traefik_bouncer
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer-secrets
          key: bouncer-api-key
    - name: AGENT_USERNAME
      valueFrom:
        secretKeyRef:
          name: crowdsec-agent-secrets
          key: agent-username
    - name: AGENT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: crowdsec-agent-secrets
          key: agent-password

agent:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
    # readOnlyRootFilesystem/runAsNonRoot left at image defaults; see the note
    # under lapi.securityContext above. The agent additionally needs the
    # hostPath /var/log mount (chart default `hostVarLog: true`) to tail
    # Traefik's pod logs, which is why the namespace uses the `privileged`
    # Pod Security Standard (see namespace.yaml).

  podLabels:
    app.kubernetes.io/name: crowdsec-agent
    app.kubernetes.io/instance: crowdsec-agent

  # Read the JSON access logs of the Traefik pods (kubernetes/traefik) so
  # CrowdSec can match them against the crowdsecurity/traefik parsers/scenarios
  # installed below. This requires Traefik's accessLog.format: json (see
  # kubernetes/traefik/traefik-values.yaml) -- if that is ever changed away
  # from json, the crowdsecurity/traefik parser will silently stop matching
  # lines.
  acquisition:
    - namespace: traefik
      podName: traefik-*
      program: traefik

  env:
    # Collections installed from https://hub.crowdsec.net on startup:
    # - crowdsecurity/traefik: Traefik-specific parsers/scenarios
    # - crowdsecurity/http-cve: known HTTP CVE exploitation attempts
    # - crowdsecurity/base-http-scenarios: generic HTTP brute-force/probing scenarios
    # - crowdsecurity/http-dos: HTTP(S) flood/DoS detection scenarios
    # See kubernetes/crowdsec/README.md for other collections considered but
    # not installed (they need application log ingestion this agent doesn't
    # currently do, since it only tails Traefik's pod logs).
    - name: COLLECTIONS
      value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/http-dos"
    # The agent runs with DISABLE_LOCAL_API=true (this chart's default for the agent
    # DaemonSet) and authenticates to the separate LAPI Deployment as a "machine".
    # Setting the same AGENT_USERNAME/AGENT_PASSWORD as lapi.env above makes the
    # entrypoint write this fixed identity into local_api_credentials.yaml instead of
    # generating a random one -- matching whichever machine LAPI registered via
    # `cscli machines add "$AGENT_USERNAME" ... --force` on its own startup, so the
    # two sides never fall out of sync regardless of which pod restarts first.
    - name: AGENT_USERNAME
      valueFrom:
        secretKeyRef:
          name: crowdsec-agent-secrets
          key: agent-username
    - name: AGENT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: crowdsec-agent-secrets
          key: agent-password
