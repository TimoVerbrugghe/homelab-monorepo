# This chart's templates don't set metadata.namespace on every resource, so an explicit -n is required:
#   kustomize build --enable-helm . | kubectl apply -n crowdsec -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crowdsec

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab

resources:
  - namespace.yaml

# The whole secret is reflected into traefik for the bouncer plugin's mounted key file.
secretGenerator:
  - name: crowdsec-secrets
    envs:
      - crowdsec-secrets.env
    type: Opaque
    options:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "traefik"

generatorOptions:
  disableNameSuffixHash: true

# version is pinned: an unpinned chart can resolve to a different (and
# potentially differently-behaving) release per machine/run depending on the
# local Helm cache. Bump deliberately and re-verify the rendered output when
# upgrading.
helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: crowdsec-values.yaml
