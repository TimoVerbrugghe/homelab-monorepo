# This chart's templates don't set metadata.namespace on every resource, so needs an explicit -n:
#   kustomize build --enable-helm . | kubectl apply -n crowdsec -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crowdsec

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab

resources:
  - namespace.yaml

# All three secrets are static, self-generated (not cscli-issued) except
# console-secrets, which holds the enroll key copied from app.crowdsec.net; see
# crowdsec-*.env.template. bouncer-secrets is reflected into traefik for the
# bouncer plugin's mounted key file; agent-secrets is the agent DaemonSet's
# shared machine identity. All are exposed to LAPI via crowdsec-values.yaml
# (lapi.env); bouncer/agent secrets re-register with the same values on every
# restart, console-secrets re-runs `cscli console enroll` (idempotent).
secretGenerator:
  - name: crowdsec-bouncer-secrets
    envs:
      - crowdsec-bouncer.env
    type: Opaque
    options:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "traefik"
  - name: crowdsec-agent-secrets
    envs:
      - crowdsec-agent.env
    type: Opaque
  - name: crowdsec-console-secrets
    envs:
      - crowdsec-console.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: crowdsec-values.yaml
