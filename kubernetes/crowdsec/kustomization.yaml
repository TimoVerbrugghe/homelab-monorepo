# This chart's templates don't set metadata.namespace on every resource, so
# `kubectl apply -k .` needs an explicit -n:
#   kubectl kustomize --enable-helm . | kubectl apply -n crowdsec -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crowdsec

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab

resources:
  - namespace.yaml

# Both secrets are static, self-generated values (not cscli-issued); see
# crowdsec-*.env.template. bouncer-secrets is reflected into traefik for the
# bouncer plugin's mounted key file; agent-secrets is the agent DaemonSet's
# shared machine identity. Both are also exposed to LAPI via crowdsec-values.yaml
# (lapi.env) so it re-registers them with the same values on every restart.
secretGenerator:
  - name: crowdsec-bouncer-secrets
    envs:
      - crowdsec-bouncer.env
    type: Opaque
    options:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "traefik"
  - name: crowdsec-agent-secrets
    envs:
      - crowdsec-agent.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: crowdsec-values.yaml
