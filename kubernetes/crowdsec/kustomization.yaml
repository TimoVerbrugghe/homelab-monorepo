# `kubectl apply -k .` does not support helmCharts: (it errors out demanding
# --enable-helm, a flag `apply -k` doesn't have), so this must always be
# rendered and applied in one step:
#   kubectl kustomize --enable-helm . | kubectl apply -n crowdsec -f -
# (the -n flag is required: this chart's templates don't set metadata.namespace on
# every resource, and kustomize's namespace transformer doesn't backfill it onto
# Helm-inflated output -- see .github/workflows/deploy-k8s-resource.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crowdsec

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab

resources:
  - namespace.yaml

# The bouncer key is a static, self-generated pre-shared value (see
# crowdsec-bouncer.env.template) rather than one obtained from `cscli bouncers add`.
# It's stored here and reflected into the traefik namespace so the CrowdSec Traefik
# bouncer plugin can read it as a mounted file; it's also exposed to LAPI via
# lapi.env (BOUNCER_KEY_traefik_bouncer) in crowdsec-values.yaml so LAPI
# self-registers the traefik_bouncer with this same key on every restart.
secretGenerator:
  - name: crowdsec-bouncer-secrets
    envs:
      - crowdsec-bouncer.env
    type: Opaque
    options:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "traefik"

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: crowdsec-values.yaml
