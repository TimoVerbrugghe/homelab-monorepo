# Managed by Kustomize configMapGenerator - do not edit the ConfigMap directly, edit this file instead.
daemon=300
syslog=yes
ssl=yes
pid=/config/ddclient.pid
cache=/config/ddclient.cache
use=web, web=https://cloudflare.com/cdn-cgi/trace, web-skip='ip='

protocol=cloudflare
# "timo.be" zone, inferred from the "jellyfin.timo.be" record below.
zone=timo.be
ttl=1
# "token" is the literal login value required when the password holds a Cloudflare API token (not a Global API Key).
login=token
# Loads the real value from the CLOUDFLARE_API_TOKEN environment variable at runtime.
# This keeps the token out of the ConfigMap entirely; it is injected via the ddclient container's env (see ddclient.yaml).
password_env=CLOUDFLARE_API_TOKEN
# ddclient can only update an existing record, not create one - an A record for
# jellyfin.timo.be must already exist in Cloudflare before this can succeed.
jellyfin.timo.be
