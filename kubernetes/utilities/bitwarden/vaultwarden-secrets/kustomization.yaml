apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

secretGenerator:
  - name: vaultwarden-secrets-bootstrap
    namespace: utilities
    envs:
      - vaultwarden-secrets.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: true

resources:
  - shared-credentials-namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - api-service.yaml
  - dashboard.yaml
  - dashboard-service.yaml
  - dashboard-ingress.yaml
