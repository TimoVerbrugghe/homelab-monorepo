# Loads the CrowdSec bouncer plugin so it can be referenced by the
# crowdsec-bouncer Middleware (kubernetes/traefik/middlewares/crowdsec-bouncer.yaml).
# Requires the CrowdSec LAPI + agent to be deployed first (kubernetes/crowdsec/).
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1

# Mounts the bouncer API key (reflected from the crowdsec namespace, see
# kubernetes/crowdsec/kustomization.yaml) as a file the plugin can read.
volumes:
  - name: crowdsec-bouncer-secrets
    mountPath: "/etc/traefik/crowdsec"
    type: secret

log:
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
  filters:
    statusCodes: "400-499,500-599"
    retryAttempts: true

deployment:
  enabled: true
  replicas: 3

ports:
  web:
    # Setting port manually to 8001 since portaineredge uses port 8000, otherwise default helm chat values will use 8000
    port: 8001
    expose:
      default: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  traefik:
    port: 9000
    exposedPort: 9000
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    asDefault: true
    exposedPort: 443
    protocol: TCP
    # Necessary for VNC and other apps to work without issues. Otherwise you get connection and timeout issues.
    # See https://community.traefik.io/t/traefik-vnc-web-apps-works-in-docker-but-not-in-kubernetes/27180/2
    transport:
      respondingTimeouts:
        readTimeout: 420s
        writeTimeout: 420s
        idleTimeout: 420s
    http:
      tls:
        enabled: true
      # secureheaders and ratelimit are defined in kubernetes/traefik/middlewares/.
      # crowdsec-bouncer requires kubernetes/crowdsec/ to be deployed first.
      middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd
        - traefik-secureheaders@kubernetescrd
        - traefik-ratelimit@kubernetescrd
  metrics:
    port: 9100
    expose:
      default: true
    exposedPort: 9100
    protocol: TCP
  portaineredge:
    port: 8000
    expose:
      default: false
    exposedPort: 8000
    protocol: TCP

ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
    namespaces: []
    allowCrossNamespace: true
    allowExternalNameServices: true

  kubernetesIngress:
    enabled: true
    namespaces: []
    allowExternalNameServices: true
    publishedService:
      enabled: true

# The dashboard is still served (api.dashboard defaults to true) on the
# internal `traefik` entrypoint (port 9000, see ports.traefik above).
# The old top-level `dashboard: enabled: true` key from the pre-41.x chart
# schema was dropped here because chart 41.5.0's values.schema.json rejects
# unknown top-level keys; use `ingressRoute.dashboard.enabled: true` instead
# if you want the dashboard exposed via an IngressRoute.
rbac:
  enabled: true
  
# Will define my own services because I want to expose traefik both through tailscale and through kube-vip
service:
  enabled: false