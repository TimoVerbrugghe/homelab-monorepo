# Loads the CrowdSec bouncer plugin so it can be referenced by the
# crowdsec-bouncer Middleware (kubernetes/traefik/middlewares/crowdsec-bouncer.yaml).
# Requires the CrowdSec LAPI + agent to be deployed first (kubernetes/crowdsec/).
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1

# Mounts the bouncer API key (reflected from the crowdsec namespace, see
# kubernetes/crowdsec/kustomization.yaml) as a file the plugin can read.
volumes:
  - name: crowdsec-bouncer-secrets
    mountPath: "/etc/traefik/crowdsec"
    type: secret

log:
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
  filters:
    statusCodes: "400-499,500-599"
    retryAttempts: true

deployment:
  enabled: true
  replicas: 3

# traefik-kubevip uses externalTrafficPolicy: Local (see traefik-service.yaml) so
# CrowdSec/ratelimit see the real client IP instead of a SNAT'd node IP. kube-vip
# only elects a leader (and therefore only advertises the VIP) from control-plane
# nodes (kube-vip-ds nodeAffinity: node-role.kubernetes.io/{master,control-plane}).
# Require one Traefik pod per control-plane node so every possible kube-vip leader
# always has a local endpoint to route Local-policy traffic to.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname

# With replicas pinned 1:1 to control-plane nodes (see affinity above), the
# default rolling update (maxUnavailable: 0, maxSurge: 1) has no spare node to
# surge a new pod onto and deadlocks. maxUnavailable: 1/maxSurge: 0 lets an old
# pod terminate first so the new one can take its place.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

ports:
  web:
    # Setting port manually to 8001 since portaineredge uses port 8000, otherwise default helm chat values will use 8000
    port: 8001
    expose:
      default: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  traefik:
    port: 9000
    exposedPort: 9000
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    asDefault: true
    exposedPort: 443
    protocol: TCP
    # Necessary for VNC and other apps to work without issues. Otherwise you get connection and timeout issues.
    # See https://community.traefik.io/t/traefik-vnc-web-apps-works-in-docker-but-not-in-kubernetes/27180/2
    transport:
      respondingTimeouts:
        readTimeout: 420s
        writeTimeout: 420s
        idleTimeout: 420s
    http:
      tls:
        enabled: true
      # secureheaders and ratelimit are defined in kubernetes/traefik/middlewares/.
      # crowdsec-bouncer requires kubernetes/crowdsec/ to be deployed first.
      # All three Middleware CRDs referenced below live in
      # kubernetes/traefik/middlewares/ (applied separately from this Helm
      # chart, via `kubectl apply -k kubernetes/traefik/middlewares/` -- see
      # kubernetes/README.md). Apply that kustomization before or together
      # with this chart: if it's applied after, Traefik will reject these
      # entrypoint middleware references (unresolved Middleware CRDs) until it
      # is restarted or the config is reloaded.
      middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd
        - traefik-secureheaders@kubernetescrd
        - traefik-ratelimit@kubernetescrd
  metrics:
    port: 9100
    expose:
      default: true
    exposedPort: 9100
    protocol: TCP
  portaineredge:
    port: 8000
    expose:
      default: false
    exposedPort: 8000
    protocol: TCP
  # Dedicated WAN-facing entrypoint for Jellyfin only. Kept separate from
  # websecure so that forwarding this single port on the router cannot expose
  # any other IngressRoute that also happens to use websecure. Internal
  # container port intentionally differs from Jellyfin's own 8096 app port to
  # avoid confusion between the two (they live on different Services/IPs, so
  # there is no actual conflict either way).
  jellyfin:
    port: 9443
    expose:
      default: false
    exposedPort: 8096
    protocol: TCP
    http:
      tls:
        enabled: true
      # Same protections as websecure (see comment above). Middleware CRDs
      # live in kubernetes/traefik/middlewares/ (applied via
      # `kubectl apply -k kubernetes/traefik/middlewares/` -- see
      # kubernetes/README.md). Apply that kustomization before or together
      # with this chart: if it's applied after, Traefik will reject these
      # entrypoint middleware references (unresolved Middleware CRDs) until it
      # is restarted or the config is reloaded.
      middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd
        - traefik-secureheaders@kubernetescrd
        - traefik-ratelimit@kubernetescrd

ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
    namespaces: []
    allowCrossNamespace: true
    allowExternalNameServices: true

  kubernetesIngress:
    enabled: true
    namespaces: []
    allowExternalNameServices: true
    publishedService:
      enabled: true

# The dashboard is still served (api.dashboard defaults to true) on the
# internal `traefik` entrypoint (port 9000, see ports.traefik above).
# The old top-level `dashboard: enabled: true` key from the pre-41.x chart
# schema was dropped here because chart 41.5.0's values.schema.json rejects
# unknown top-level keys; use `ingressRoute.dashboard.enabled: true` instead
# if you want the dashboard exposed via an IngressRoute.
rbac:
  enabled: true
  
# Will define my own services because I want to expose traefik both through tailscale and through kube-vip
service:
  enabled: false