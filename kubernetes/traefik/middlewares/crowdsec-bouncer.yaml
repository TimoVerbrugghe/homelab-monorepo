apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /etc/traefik/crowdsec/bouncer-api-key
      # Default (0) flips the plugin's internal isCrowdsecStreamHealthy flag to
      # unhealthy after the very first failed decisions-stream poll, which then
      # blocks ALL traffic (fail-closed) until the stream recovers -- this caused a
      # ~6 minute blanket 403 outage on a single transient LAPI hiccup. -1 disables
      # that flag entirely: on a stream failure the plugin just keeps serving from
      # its last-known-good decision cache (known bans still enforced, unknown IPs
      # fail open) instead of blocking everyone.
      updateMaxFailure: -1
