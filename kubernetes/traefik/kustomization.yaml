# Apply all these resources with `kustomize build --enable-helm . | kubectl apply -f -` from the directory containing this file
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

resources:
  - traefik-namespace.yaml
  - traefik-service.yaml

patches:
  - target:
      kind: Deployment
      name: traefik
    path: traefik-deployment-patch.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    # Pinned: without a version, kustomize/helm can resolve (or cache) an
    # older chart depending on the machine/run. Chart versions below 41.0.0
    # (e.g. 37.1.1) silently drop the rendered `--entryPoints.<name>.http.tls`
    # (for custom entrypoints) and `--entryPoints.<name>.http.middlewares`
    # args entirely, even though traefik-values.yaml sets them correctly.
    # Bump deliberately and re-verify the rendered args after doing so.
    version: 41.5.0
    namespace: traefik
    includeCRDs: true
    releaseName: traefik
    valuesFile: traefik-values.yaml