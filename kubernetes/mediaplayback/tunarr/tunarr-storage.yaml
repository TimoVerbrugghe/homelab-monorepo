---
# Pre-provisioned (static) CSI volume: the zvol and the iSCSI target already exist
# on TrueNAS and were previously consumed by the deprecated in-tree `iscsi:` volume
# plugin, which Talos 1.14 workload isolation breaks. Switching to spec.csi keeps
# the exact same block device -- no data is copied and democratic-csi only formats
# a device that is not already formatted, so the existing ext4 filesystem survives.
#
# Because this PV is imported rather than provisioned, democratic-csi's controller
# never manages it: the node plugin simply logs into portal/iqn/lun below.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tunarr-pv
  namespace: mediaplayback
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-iscsi
  csi:
    driver: org.democratic-csi.iscsi
    # Arbitrary but must be unique and stable; not a TrueNAS-side identifier.
    volumeHandle: tunarr-pv
    fsType: ext4
    volumeAttributes:
      node_attach_driver: iscsi
      portal: 10.10.10.2:3260
      portals: ""
      interface: ""
      iqn: iqn.2025-11.timo.be:tunarr
      lun: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tunarr-pvc
  namespace: mediaplayback
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: truenas-iscsi
  volumeName: tunarr-pv # binds only to the pre-provisioned PV above
