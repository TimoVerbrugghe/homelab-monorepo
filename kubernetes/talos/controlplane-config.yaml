version: v1alpha1
cluster:
  # .cluster.allowSchedulingOnControlPlanes is listed as moved to KubeNodeConfig in
  # Talos 1.14, but that document exposes no equivalent field yet (only taints), so
  # it stays in v1alpha1 where it is still honoured.
  allowSchedulingOnControlPlanes: true
---
# Replaces the deprecated v1alpha1 cluster.apiServer field (Talos 1.14).
# Note the rename: cluster.apiServer.certSANs -> certExtraSANs.
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 10.10.10.33
  - kubernetes.local.timo.be
extraArgs:
  default-not-ready-toleration-seconds: 120
  default-unreachable-toleration-seconds: 120
