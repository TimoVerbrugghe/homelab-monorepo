# Add autoupdate through keel for cert-manager-webhook
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook
  annotations:
    keel.sh/policy: all
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
spec:
  template:
    spec:
      containers:
        - name: cert-manager-webhook
          # Chart ships no default resources; sized from observed usage.
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"