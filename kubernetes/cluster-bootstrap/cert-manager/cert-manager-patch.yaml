# Add autoupdate through keel for cert-manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  annotations:
    keel.sh/policy: all
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
spec:
  template:
    spec:
      containers:
        - name: cert-manager-controller
          # Chart ships no default resources at all (upstream best-practice guide
          # says to size for your own cluster); sized from observed usage.
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"