name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install YAML linting tools
        run: pip install yamllint

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install JSON linting tools
        run: npm install -g jsonlint

      - name: Install kubectl and kustomize
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Install talosctl
        run: |
          curl -sL https://talos.dev/install | sh
          talosctl version --client

      - name: Install shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y shellcheck

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-cicd

      # Both configs come from the repository Actions secrets (rotated by
      # rotate-cluster-credentials.yaml).
      - name: Provision kubeconfig for kubernetes MCP server
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          if ! kubectl config view --minify > /dev/null 2>&1; then
            echo "::error::KUBECONFIG secret is missing or not a valid kubeconfig"
            exit 1
          fi
          kubectl cluster-info || echo "::warning::Cluster not reachable yet"

      - name: Provision talosconfig
        run: |
          mkdir -p "$HOME/.talos"
          echo "${{ secrets.TALOSCONFIG }}" > "$HOME/.talos/config"
          chmod 600 "$HOME/.talos/config"
          if ! talosctl config info > /dev/null 2>&1; then
            echo "::error::TALOSCONFIG secret is missing or not a valid talosconfig"
            exit 1
          fi

      - name: Verify tool versions
        run: |
          yamllint --version
          jsonlint --version || true
          kubectl version --client
          kustomize version
          talosctl version --client
          shellcheck --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uvx" --version
          tailscale status
