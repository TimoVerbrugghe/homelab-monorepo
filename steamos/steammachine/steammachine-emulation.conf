## Keep the Emulation NFS mount/automount system units and their enablement symlinks
## so SteamOS's atomic updates don't discard them (see steamos/steammachine/README.md).
/etc/systemd/system/home-deck-Emulation-roms.mount
/etc/systemd/system/home-deck-Emulation-roms.automount
/etc/systemd/system/multi-user.target.wants/home-deck-Emulation-roms.automount
/etc/systemd/system/home-deck-Emulation-bios.mount
/etc/systemd/system/home-deck-Emulation-bios.automount
/etc/systemd/system/multi-user.target.wants/home-deck-Emulation-bios.automount
/etc/systemd/system/home-deck-Emulation-saves.mount
/etc/systemd/system/home-deck-Emulation-saves.automount
/etc/systemd/system/multi-user.target.wants/home-deck-Emulation-saves.automount
