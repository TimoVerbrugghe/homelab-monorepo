## Keep the NFS ROMs mount/automount system units and their enablement symlink so
## SteamOS's atomic updates don't discard them (see steamos/steammachine/README.md).
/etc/systemd/system/home-deck-Emulation-roms.mount
/etc/systemd/system/home-deck-Emulation-roms.automount
/etc/systemd/system/multi-user.target.wants/home-deck-Emulation-roms.automount
